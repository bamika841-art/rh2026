<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob: https:; connect-src 'self' https:; base-uri 'none'">
<title>SEN-RH CONNECT</title>
<style>
/* ===== SEN-RH CONNECT — charte verte émeraude ===== */
:root{box-sizing:border-box;--g1:#F0FDF4;--g2:#D1FAE5;--g5:#10B981;--g7:#059669;--g8:#087F45;--g9:#064E35;
--bg:#F0FDF4;--card:#fff;--tx:#0b2e20;--mu:#64748B;--bl:#087F45;--gr:#059669;--rd:#c0392b;--or:#b9770e;--bd:#d3ebdd;
--grad:linear-gradient(135deg,#064E35 0%,#087F45 55%,#10B981 100%);
--sh:0 1px 2px rgba(6,78,53,.06),0 10px 28px rgba(6,78,53,.08);--ez:cubic-bezier(.22,.8,.3,1)}
:root[data-theme=dark]{color-scheme:dark;--bg:#06130d;--card:#0d2018;--tx:#e6f6ee;--mu:#93aaa0;--bl:#34d399;--gr:#34d399;--rd:#ff7b6b;--or:#f0b04a;--bd:#1b3a2b;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}
:root[data-theme=dark] .b{color:#04140c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){color-scheme:dark;--bg:#06130d;--card:#0d2018;--tx:#e6f6ee;--mu:#93aaa0;--bl:#34d399;--gr:#34d399;--rd:#ff7b6b;--or:#f0b04a;--bd:#1b3a2b;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}
:root:not([data-theme=light]):not([data-theme=dark]) .b{color:#04140c}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h2{font-size:20px;margin:4px 0 10px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 10px}
h4{margin:16px 0 6px;color:var(--bl);font-size:14px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
a{color:var(--bl)}
button{font:inherit}
:focus-visible{outline:2px solid var(--g5);outline-offset:2px}
.ic{width:18px;height:18px;flex:0 0 auto;vertical-align:-3px}

/* ---- Chargement ---- */
.boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;color:var(--mu)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(16,185,129,.2);border-top-color:var(--g7);animation:spin .8s linear infinite}

/* ---- Coque : menu latéral + barre supérieure ---- */
.shell{display:flex;min-height:100vh}
.sb{flex:0 0 268px;width:268px;height:100vh;height:100dvh;position:sticky;top:0;align-self:flex-start;background:linear-gradient(185deg,#064E35 0%,#087F45 70%,#0a8f50 100%);color:#e9fff3;display:flex;flex-direction:column;z-index:40;padding-top:env(safe-area-inset-top,0px)}
.sbh{display:flex;align-items:center;gap:10px;padding:18px 16px 12px}
.sbh b{display:block;font-size:16px;letter-spacing:.3px}
.sbh small{display:block;opacity:.7;font-size:11.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:inline-grid;place-items:center;color:#fff;flex:0 0 40px}
.logo .ic{width:22px;height:22px}
.sbn{flex:1;overflow-y:auto;padding:4px 10px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.gt{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;opacity:.55;padding:14px 10px 4px;font-weight:600}
.ni{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:rgba(233,255,243,.86);padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left;transition:background .2s,transform .2s var(--ez),color .2s;margin:1px 0}
.ni span{flex:1;min-width:0}
.ni:hover{background:rgba(255,255,255,.12);transform:translateX(3px);color:#fff}
.ni.on{background:rgba(255,255,255,.2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #6ee7b7}
.sbf{padding:12px;border-top:1px solid rgba(255,255,255,.15);display:flex;gap:10px;align-items:center;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sbf .av{margin:0;background:rgba(255,255,255,.2)}
.sbf div{flex:1;min-width:0;font-size:13px;line-height:1.3}
.sbf b,.sbf small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbf small{opacity:.7;font-size:11px}
.sbf .ib{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.sbf .ib:hover{background:rgba(255,255,255,.25)}
.ov{display:none}
.mc{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--bd)}
.ib{position:relative;width:40px;height:40px;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:inline-grid;place-items:center;cursor:pointer;transition:background .2s,transform .15s,border-color .2s;flex:0 0 40px;padding:0}
.ib:hover{background:rgba(16,185,129,.12);border-color:var(--g5)}
.ib:active{transform:scale(.93)}
.mnu{display:none}
.srch{position:relative;flex:1;min-width:0;max-width:440px;margin-right:auto}
.srch>.ic{position:absolute;left:11px;top:50%;margin-top:-9px;color:var(--mu);pointer-events:none}
.srch input{padding-left:36px}
.clk{font-size:12.5px;color:var(--mu);text-transform:capitalize;white-space:nowrap}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--rd);color:#fff;font-size:11px;font-style:normal;display:none;place-items:center;padding:0 4px}
.has .dot{display:grid;animation:pulse 1.8s infinite}
.has .ic{animation:ring 2.6s infinite;transform-origin:50% 0}
.bw{position:relative}
.ndd,.gso{position:absolute;top:calc(100% + 8px);background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 16px 40px rgba(6,78,53,.2);display:none;max-height:70vh;overflow:auto;z-index:60}
.gso{left:0;right:0}
.ndd{right:0;width:min(340px,90vw);padding:6px}
.ndd.on,.gso.on{display:block;animation:pop .22s var(--ez)}
.nh{font-weight:700;padding:8px 10px;color:var(--bl)}
.ni2{padding:8px 10px;border-radius:9px;font-size:13px}
.ni2.un{background:rgba(16,185,129,.1);font-weight:600}
.ni2 small{display:block;color:var(--mu);font-weight:400;font-size:11.5px}
.gi{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;transition:background .15s}
.gi:hover{background:rgba(16,185,129,.12)}
.gi small{display:block;color:var(--mu);font-size:11.5px}
.usr{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border:1px solid var(--bd);border-radius:99px;font-size:13px;white-space:nowrap}
.usr .av{margin:0}
main{width:100%;max-width:1320px;margin:0 auto;padding:20px 18px 40px}
main.out{opacity:0;transform:translateY(6px);transition:opacity .13s,transform .13s}

/* ---- En-tête de page ---- */
.ph{display:flex;gap:14px;align-items:center;margin:2px 0 16px}
.phi{width:46px;height:46px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:var(--sh);flex:0 0 46px}
.phi .ic{width:22px;height:22px}
.ph h2{margin:0;font-size:22px}
.ph p{margin:2px 0 0;color:var(--mu);font-size:13.5px}

/* ---- Cartes ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);transition:transform .2s var(--ez),box-shadow .2s,border-color .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.grid>.card{margin-bottom:0}
.grid>.card:hover{transform:translateY(-2px) scale(1.012);border-color:var(--g5)}
.k{font-size:28px;font-weight:700;color:var(--bl);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.k small{display:block;font-size:12px;font-weight:500;color:var(--mu);letter-spacing:0}
.card.k{background:linear-gradient(160deg,var(--card),rgba(16,185,129,.08));border-left:4px solid var(--g7)}
.hero{background:var(--grad);color:#fff;border-radius:20px;padding:22px;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden;box-shadow:var(--sh);margin-bottom:6px}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);pointer-events:none}
.hero .clk{color:rgba(255,255,255,.85)}
.hh{font-size:24px;font-weight:700;margin:4px 0;letter-spacing:-.01em}
.hp{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 14px;position:relative;z-index:1}
.hp .av{margin:0;background:rgba(255,255,255,.25)}
.sc{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.sc .btn{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px;margin:16px 0}
.stat{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;color:var(--tx);margin:0;position:relative;overflow:hidden;width:100%}
.stat::after{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.22),transparent 70%)}
button.stat:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 32px rgba(6,78,53,.16);border-color:var(--g5)}
div.stat{cursor:default}
.stat .si{width:48px;height:48px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:0 0 48px;box-shadow:0 6px 14px rgba(8,127,69,.3)}
.stat .si .ic{width:24px;height:24px}
.stat b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .t{display:block;font-weight:600;font-size:13.5px}
.stat small{display:block;color:var(--mu);font-size:12px}

/* ---- Organigramme ---- */
.orgt,.orgt ul{list-style:none;margin:0;padding:0}
.orgt ul{margin-left:18px;padding-left:20px;border-left:2px solid var(--bd)}
.orgt li{margin:8px 0;position:relative}
.orgt ul>li::before{content:"";position:absolute;left:-20px;top:22px;width:18px;border-top:2px solid var(--bd)}
.onode{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);box-shadow:var(--sh);transition:transform .2s var(--ez),border-color .2s}
.onode:hover{transform:scale(1.03);border-color:var(--g5)}
.onode small{display:block;color:var(--mu);font-size:12px}
.onode .av{margin:0}

/* ---- Boutons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--grad);color:#fff;padding:9px 15px;border-radius:11px;font-weight:600;cursor:pointer;margin:6px 6px 0 0;min-height:38px;position:relative;overflow:hidden;transition:filter .15s,transform .12s,box-shadow .2s;box-shadow:0 2px 8px rgba(8,127,69,.25)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s;pointer-events:none}
.btn:hover::after{transform:translateX(120%)}
.btn:hover{filter:brightness(1.07);box-shadow:0 6px 16px rgba(8,127,69,.3);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn .ic{width:15px;height:15px;vertical-align:-2px}
.btn.s{padding:5px 10px;font-size:13px;min-height:30px;margin:2px 4px 2px 0;box-shadow:none}
.btn.g{background:linear-gradient(120deg,#059669,#10B981)}
.btn.r{background:var(--rd)}
.btn.o{background:var(--or)}
.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.w{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;box-shadow:none}
.btn.ld{pointer-events:none;color:transparent}
.btn.ld::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}

/* ---- Formulaires ---- */
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px;font-weight:500}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:11px;background:var(--card);color:var(--tx);font:inherit;min-height:40px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g7);box-shadow:0 0 0 3px rgba(16,185,129,.22)}
input:user-invalid,select:user-invalid,textarea:user-invalid{border-color:var(--rd);background:rgba(192,57,43,.06)}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--g7)}
input[type=file]{padding:7px}
.sec{margin:18px 0 4px}

/* ---- Tableaux ---- */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
th{background:linear-gradient(120deg,#064E35,#087F45);color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap}
table:not(.pl) tr:nth-child(even) td{background:rgba(16,185,129,.05)}
table:not(.pl) tr:hover td{background:rgba(16,185,129,.12)}
tr:last-child td{border-bottom:0}
.tc{display:block}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.empty .ic{width:30px;height:30px;opacity:.5}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;white-space:nowrap}
.b.attente{background:var(--or)}.b.valide{background:var(--gr)}.b.refuse{background:var(--rd)}.b.complement{background:#0f766e}.b.annule{background:var(--mu)}
.cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--rd);color:#fff;font-size:11px;text-align:center;margin-left:6px}

/* ---- Alertes, barres ---- */
.warn{background:rgba(185,119,14,.1);border-left:4px solid var(--or);padding:10px 12px;border-radius:10px;margin:8px 0;font-size:13.5px}
.warn.err{border-color:var(--rd);background:rgba(192,57,43,.09)}
.warn.ok{border-color:var(--gr);background:rgba(5,150,105,.1)}
.bar{height:10px;background:rgba(16,185,129,.14);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g7),var(--g5));border-radius:6px;transform-origin:left}
.row{display:flex;justify-content:space-between;gap:8px;margin:6px 0;font-size:13.5px;flex-wrap:wrap}
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:8px}
.bar2>div{flex:1;min-width:140px}
.hl li{margin:3px 0;font-size:13.5px}
.doc{border:2px solid var(--bl);padding:16px;border-radius:12px}
.sig{display:flex;justify-content:space-between;margin-top:34px;font-size:13px}
.sig span{border-top:1px solid var(--mu);padding-top:4px;min-width:40%;text-align:center}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;font-size:11px;font-weight:700;vertical-align:middle;margin-right:8px;flex:0 0 30px}
.cht{width:100%;height:auto;max-height:240px}

/* ---- Planning ---- */
.pl{border-collapse:separate;border-spacing:0}
.pl td,.pl th{padding:3px 2px;text-align:center;font-size:11.5px;min-width:26px;border:1px solid var(--bd);background:var(--card);color:var(--tx);white-space:nowrap}
.pl th{color:var(--mu);font-weight:600;text-transform:none;letter-spacing:0;background:rgba(16,185,129,.12)}
.pl td:first-child,.pl th:first-child{text-align:left;position:sticky;left:0;min-width:130px;z-index:1;padding-left:8px}
.pl td.v{background:var(--g7)}.pl td.a{background:var(--or)}.pl td.we{background:rgba(100,116,139,.22)}
.pl td.h{background:repeating-linear-gradient(45deg,#a7f3d0,#a7f3d0 3px,#6ee7b7 3px,#6ee7b7 6px)}
.leg span{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 12px;vertical-align:-2px}
.leg span.hf{background:repeating-linear-gradient(45deg,#a7f3d0,#a7f3d0 3px,#6ee7b7 3px,#6ee7b7 6px)}

/* ---- Dialogues, notifications ---- */
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);width:min(560px,94vw);padding:20px;max-height:92vh;overflow:auto;box-shadow:0 24px 70px rgba(3,30,20,.4)}
dialog[open]{animation:pop .28s var(--ez)}
dialog::backdrop{background:rgba(3,30,20,.55);backdrop-filter:blur(2px);animation:fade .25s}
.dact{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--g9);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ez);z-index:99;max-width:92vw;border-left:5px solid var(--g5);box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.t-er{background:#7f1d1d;border-left-color:#f87171}

/* ---- Connexion ---- */
.lw{min-height:100vh;display:grid;place-items:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));background:var(--grad)}
.login{width:min(420px,100%);margin:0;padding:26px}
.lg{display:flex;justify-content:center;margin-bottom:6px}
.lg .logo{background:var(--grad);width:56px;height:56px;border:0}
.lg .logo .ic{width:28px;height:28px}
.login h2{text-align:center;color:var(--bl)}
.login .btn{width:100%}

/* ---- Animations ---- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes zoomin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rowin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.5)}50%{box-shadow:0 0 0 6px rgba(192,57,43,0)}}
@keyframes ring{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(14deg)}94%{transform:rotate(-12deg)}97%{transform:rotate(8deg)}}
main.fresh>*{animation:rise .45s var(--ez) both}
main.fresh>*:nth-child(2){animation-delay:.05s}main.fresh>*:nth-child(3){animation-delay:.1s}main.fresh>*:nth-child(4){animation-delay:.15s}
main.fresh>*:nth-child(5){animation-delay:.2s}main.fresh>*:nth-child(6){animation-delay:.25s}main.fresh>*:nth-child(7){animation-delay:.3s}
.login{animation:zoomin .5s var(--ez) both}
.fresh .card.k{animation:zoomin .5s var(--ez) both}
.fresh .stat{animation:zoomin .5s var(--ez) both}
.fresh .stat:nth-child(2){animation-delay:.04s}.fresh .stat:nth-child(3){animation-delay:.08s}.fresh .stat:nth-child(4){animation-delay:.12s}
.fresh .stat:nth-child(5){animation-delay:.16s}.fresh .stat:nth-child(6){animation-delay:.2s}.fresh .stat:nth-child(7){animation-delay:.24s}.fresh .stat:nth-child(8){animation-delay:.28s}
.fresh .bar i{animation:growx .9s var(--ez) both}
.fresh .cht rect{transform-box:fill-box;transform-origin:bottom;animation:growy .8s var(--ez) both}
.fresh .rt tr{animation:rowin .35s var(--ez) both}
.fresh .rt tr:nth-child(2){animation-delay:.03s}.fresh .rt tr:nth-child(3){animation-delay:.06s}.fresh .rt tr:nth-child(4){animation-delay:.09s}
.fresh .rt tr:nth-child(5){animation-delay:.12s}.fresh .rt tr:nth-child(6){animation-delay:.15s}.fresh .rt tr:nth-child(7){animation-delay:.18s}.fresh .rt tr:nth-child(8){animation-delay:.21s}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

function ctrEval(v){const R=[],m=(a,b)=>(new Date(b)-new Date(a))/2629800000,d=v.fin&&v.deb?m(v.deb,v.fin):0,ko=(t,a)=>R.push({k:'ko',t,a}),w=(t,a)=>R.push({k:'w',t,a}),ok=(t,a)=>R.push({k:'ok',t,a});
 if(!v.deb||(v.type!='cdd'||v.der!='ouvrage')&&!v.fin)return[{k:'w',t:'Renseignez les dates de début et de fin.',a:''}];
 if(v.fin<v.deb)return[{k:'ko',t:'La date de fin précède la date de début.',a:''}];
 const T=v.type=='essai'?'Art. 93 à 96':'Art. 97 à 103';
 if(v.ecrit!='oui')ko(v.type=='essai'?'Sans écrit, le contrat équivaut à un CDI.':'Sans écrit, le contrat est réputé conclu pour une durée indéterminée.',v.type=='essai'?'Art. 93':'Art. 99');else ok('Écrit établi.',v.type=='essai'?'Art. 93':'Art. 99');
 if(v.dep!='oui')w('Dépôt à l’inspection du travail et de la sécurité sociale à effectuer avant tout début d’exécution.',v.type=='essai'?'Art. 93':'Art. 99');else ok('Dépôt effectué.','');
 if(v.type=='essai'){const tot=d+(+v.pre||0);

  w('Au terme, la continuation des services sans nouveau contrat équivaut à un CDI. Sauf clause expresse, la rupture est possible à tout moment sans préavis.','Art. 95-96');}
 else{
  if(v.perm=='oui')ko('Un CDD ne peut pourvoir durablement un emploi lié à l’activité normale et permanente : risque de requalification en CDI.','Art. 97');
  if(v.der=='ouvrage'){ok('Ouvrage déterminé : la durée maximale de 2 ans peut être dépassée ; le contrat ne peut alors être ni renouvelé ni prolongé.','Art. 100');if(+v.ren>0)ko('Renouvellement ou prolongation d’un CDD pour ouvrage déterminé interdit.','Art. 100');}
  else{
   if(d>24)ko('Durée du contrat ('+d.toFixed(1)+' mois) supérieure à 2 ans.','Art. 100');else ok('Durée ('+d.toFixed(1)+' mois) dans la limite de 2 ans.','Art. 100');
   if(+v.ren>1)ko('Un seul renouvellement ou une seule prolongation est admis.','Art. 100');
   const cum=d+(+v.cum||0);if(cum>48)ko('Durée cumulée avec le même employeur ('+cum.toFixed(1)+' mois) supérieure à 4 ans.','Art. 100');else ok('Durée cumulée ('+cum.toFixed(1)+' mois) dans la limite de 4 ans.','Art. 100');
   if((d>24||+v.ren>1||d+(+v.cum||0)>48)&&!['occ','sai','doc','cpl','rpl'].includes(v.der))w('Dépassement : la continuation des services vaut CDI de plein droit, sauf si l’un des cas de l’art. 101 s’applique (à vérifier avec les pièces du dossier).','Art. 101');
   if(['occ','sai','doc','cpl','rpl'].includes(v.der))w('Cas de l’art. 101 invoqué : l’effet CDI de plein droit ne s’applique pas, mais le motif doit être justifié. Le texte lu est tronqué pour certains cas : vérifier le Code.','Art. 101');}

 return R}

function rupEval(v){const R=[],ko=(t,a)=>R.push({k:'ko',t,a}),w=(t,a)=>R.push({k:'w',t,a}),ok=(t,a)=>R.push({k:'ok',t,a}),fl=v.motif=='lourde',eco=v.motif=='eco';
 if(fl)w('Faute lourde : rupture possible sans préavis, sous réserve de l’appréciation de la juridiction sur la gravité de la faute. Pas d’indemnité de licenciement.','Art. 143, 151');
 else{
  if(v.ecrit!='oui')ko('Le licenciement doit être notifié par écrit (lettre recommandée avec accusé de réception, ou remise directe contre accusé de réception).','Art. 149');
  else if(v.mode=='autre')ko('Mode de notification non prévu : lettre recommandée avec AR ou remise directe contre accusé de réception.','Art. 149');else ok('Notification écrite dans une forme prévue.','Art. 149');
  if(v.mot!='oui')w('La lettre doit indiquer le ou les motifs de la rupture.','Art. 149');
  if(v.eff!='oui')w('La lettre doit mentionner la date de prise d’effet et, hors faute lourde, la durée du préavis.','Art. 149');
  if(v.ent!='oui')w('Demande d’explication écrite ou entretien préalable non établi : irrégularité de forme. Si la cause est réelle et sérieuse, le licenciement n’est pas abusif ; le tribunal peut accorder jusqu’à 3 mois de salaire brut.','Art. 150');
  if(!eco){if(v.cause=='non')ko('Sans cause réelle et sérieuse, le licenciement pour motif personnel n’est pas permis. Risque de licenciement abusif : analyse du dossier nécessaire.','Art. 148');else if(v.cause=='doute')w('Cause réelle et sérieuse à documenter avec les pièces du dossier.','Art. 148');else ok('Cause réelle et sérieuse déclarée.','Art. 148');}
  if(v.anc=='oui')w('Ancienneté au moins égale à la période de référence du congé : indemnité de licenciement due, distincte du préavis. Son montant suit les conventions collectives et règlements applicables : non calculé ici.','Art. 151');
  else if(v.anc=='non')ok('Ancienneté inférieure à la période de référence : pas d’indemnité de licenciement au titre de l’art. 151.','Art. 151');}
 if(eco){
  if(v.dp!='oui')ko('Avant un licenciement économique, l’employeur réunit les délégués du personnel et recherche avec eux les mesures alternatives (réduction d’heures, roulement, chômage technique, formation, redéploiement…).','Art. 153');else ok('Délégués du personnel réunis.','Art. 153');

 if(!fl){

function codeQ(){const q=document.getElementById('q26').value.trim().toLowerCase(),o=document.getElementById('q26o');if(!q){o.innerHTML='';return}
 const r=/^\d+$/.test(q)?(C26[q]?[[q,C26[q]]]:[]):Object.entries(C26).filter(([n,t])=>t.toLowerCase().includes(q)).slice(0,25);
 o.innerHTML=r.length?r.map(([n,t])=>`<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><b>Art. ${esc(n)}</b> — ${esc(t)}${C26R[n]?`<div style="color:var(--mu);font-size:13px">${esc(C26R[n])}</div>`:''}</div>`).join(''):'<p>Aucun article trouvé dans l’index.</p>'}
function congeGo(){const m=+document.getElementById('g-m').value||0,j=+document.getElementById('g-j').value,e=+document.getElementById('g-e').value||0,b=2*m,x=j?m:0,y=e;
 document.getElementById('g-o').innerHTML=`<div class="card"><b>${b+x+y} jours ouvrables</b> avant majoration d’ancienneté<br><small>Base : ${b} (2 j × ${m} mois, art. 249)${j?` + ${x} (jeune travailleur)`:''}${e?` + ${y} (enfants de moins de 14 ans, par an)`:''}. Les stipulations plus favorables des conventions collectives et la majoration d’ancienneté ne sont pas calculées. Droit acquis après 12 mois de service effectif (art. 248).</small></div>`}
function ssEval(v){const R=[],ko=(t,a)=>R.push({k:'ko',t,a}),w=(t,a)=>R.push({k:'w',t,a}),ok=(t,a)=>R.push({k:'ok',t,a});
 if(!v.src)w('Référence de l’arrêté fixant les taux et plafonds non renseignée : taux et plafonds relèvent d’un arrêté (taux maximaux) et des décisions du conseil d’administration. Aucune valeur n’est préchargée.','Art. 73-74');
 const B=v.br.map(b=>{const base=Math.min(v.brut,b.plaf>0?b.plaf:v.brut),e=base*b.te/100,t=base*b.tt/100;return{...b,base,e,t}});
 B.forEach(b=>{
  if(b.lock&&b.tt>0)ko(b.n+' : cotisation à la charge exclusive de l’employeur ; part travailleur interdite (toute convention contraire est nulle).','Art. 75');
  if(!b.lock&&(b.te+b.tt)>0&&b.tt>b.te+b.tt-b.tt)ko(b.n+' : la part du travailleur ne peut excéder la moitié de la cotisation totale.','Art. 75');
  if(b.plaf>0&&v.brut>b.plaf)w(b.n+' : rémunération plafonnée à '+b.plaf+' pour le calcul.','Art. 73')});
 if(v.brut<=0)ko('Rémunération brute à renseigner. Pour une rémunération anormalement basse ou nulle, la base est le salaire minimum interprofessionnel ou agricole garanti.','Art. 73');
 return{R,B,te:B.reduce((x,b)=>x+b.e,0),tt:B.reduce((x,b)=>x+b.t,0)}}

function ssGo(){const g=i=>document.getElementById('s-'+i),n=['Prestations familiales','Accidents du travail et maladies professionnelles','Vieillesse, invalidité, survivants','Soins médicaux'],br=n.map((x,i)=>({n:x,lock:i<2,te:+g('te'+i).value||0,tt:+g('tt'+i).value||0,plaf:+g('pl'+i).value||0})),r=ssEval({brut:+g('brut').value||0,src:g('src').value.trim(),br}),c={ok:'var(--gr)',w:'var(--or)',ko:'var(--rd)'},l={ok:'Conforme',w:'À vérifier',ko:'Non conforme'},f=x=>Math.round(x).toLocaleString('fr-FR');
 document.getElementById('ss-out').innerHTML=`<div class="tw"><table><tr><th>Branche</th><th>Base</th><th>Employeur</th><th>Travailleur</th></tr>${r.B.map(b=>`<tr><td>${esc(b.n)}</td><td>${f(b.base)}</td><td>${f(b.e)}</td><td>${f(b.t)}</td></tr>`).join('')}<tr><th>Total</th><th></th><th>${f(r.te)}</th><th>${f(r.tt)}</th></tr></table></div>`+r.R.map(x=>`<div class="card" style="border-left:4px solid ${c[x.k]}"><b style="color:${c[x.k]}">${l[x.k]}</b> ${esc(x.t)} <small style="color:var(--mu)">${esc(x.a)} — loi 2026-19</small></div>`).join('')}
function ssDate(){const g=i=>document.getElementById('s-'+i).value,H=[],fm=d=>d.toISOString().slice(0,10).split('-').reverse().join('/'),a=(t,r)=>H.push(`<div class="card">${t} <small style="color:var(--mu)">${r} — loi 2026-19</small></div>`);
 if(g('emb')){const d=new Date(g('emb')+'T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+2);a('Affiliation du travailleur au plus tard le <b>'+fm(d)+'</b> (2 mois après le premier embauchage).','Art. 90')}
 if(g('per')){const [y,m]=g('per').split('-').map(Number),big=+g('eff')>=20;
  if(big)a('Employeur de 20 salariés ou plus : versement dans les 15 premiers jours de chaque mois. Période de rattachement à confirmer auprès de l’institution : fenêtre du mois suivant, du 1er au <b>15/'+String(m%12+1).padStart(2,'0')+'/'+(m==12?y+1:y)+'</b>.','Art. 93');
  else{const q=Math.ceil(m/3),nm=q*3%12+1,ny=q==4?y+1:y;a('Employeur de moins de 20 salariés : versement dans les 15 premiers jours de chaque trimestre. Fenêtre du trimestre suivant, du 1er au <b>15/'+String(nm).padStart(2,'0')+'/'+ny+'</b> (rattachement à confirmer).','Art. 93')}
  a('Déclaration nominative des salaires, mensuelle ou trimestrielle, à joindre au versement.','Art. 92')}
 if(g('acc')){const d=new Date(g('acc')+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+2);a('Accident du travail : informer l’inspection du travail et de la sécurité sociale et établir la déclaration en 3 exemplaires dans les 48 heures, soit avant le <b>'+fm(d)+'</b> (à partir de la survenance). Joindre : certificat médical, bulletin de salaire du mois précédent, pièce d’identité de la victime ; notifier l’envoi à la victime. La victime informe l’employeur dans les 48 heures.','Art. 107-108')}
 if(!H.length)H.push('<p>Renseignez au moins une date.</p>');document.getElementById('ss-d').innerHTML=H.join('')}
function aiEval(v){const R=[],w=(t,a)=>R.push({k:'w',t,a}),ko=(t,a)=>R.push({k:'ko',t,a});
 if(!(v.sal>0)||!(v.jo>0)||!(v.duree>0)){return{R:[{k:'ko',t:'Renseignez le salaire des 30 jours, le nombre de jours ouvrables de la période et la durée de l’arrêt.',a:''}]}}
 let sj=v.sal/v.jo,cap=0;
 if(v.plaf>0){cap=v.plaf*0.01;if(sj>cap){sj=cap;w('Salaire journalier plafonné à 1 % de la rémunération annuelle retenue pour l’assiette AT/MP ('+Math.round(cap)+').','Art. 138')}}
 else w('Plafond annuel d’assiette AT/MP non renseigné : le plafonnement du salaire journalier (1 % de la rémunération annuelle retenue) n’est pas appliqué. Saisissez-le d’après l’arrêté en vigueur.','Art. 138');
 const a=Math.min(v.duree,28),b=Math.max(0,v.duree-28),i1=sj*0.5,i2=sj*2/3,tot=a*i1+b*i2;
 if(v.duree>90)w('Arrêt de plus de 3 mois : en cas d’augmentation générale des salaires de la catégorie, le taux est révisé à partir du 1er jour du 4e mois, sur demande de la victime avec attestation de l’employeur.','Art. 141');

function absStats(){const now=new Date(),y=now.getUTCFullYear(),m0=now.getUTCMonth(),out=[];
 for(let i=11;i>=0;i--){const d=new Date(Date.UTC(y,m0-i,1)),ym=d.toISOString().slice(0,7),first=ym+'-01',last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).toISOString().slice(0,10);
  let v=0,a=0;S.reqs.forEach(q=>{if((q.s!='valide'&&q.s!='attente')||q.type=='teletravail')return;const st=q.a>first?q.a:first,en=q.b<last?q.b:last;if(en<st)return;const n=calc(st,en,false).n;if(q.s=='valide')v+=n;else a+=n});

function org(){const A=S.users.filter(u=>u.actif),ids=new Set(A.map(u=>u.id)),roots=A.filter(u=>!u.mgr||!ids.has(u.mgr));
